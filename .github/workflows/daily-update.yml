name: Daily Data Update

# Turso is the source of truth. This job only refreshes GitHub metrics of tools
# that are already listed, then recomputes rankings. It never inserts, renames
# or deletes tools (new tools come in through reviewed /submit entries), and it
# never syncs a local SQLite file over Turso.

on:
  schedule:
    - cron: '0 6 * * *' # 6 AM UTC daily
  workflow_dispatch: # Manual trigger

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Refresh GitHub metrics of listed tools
        run: bun run scripts/crawl-github.ts --existing
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute rankings
        run: bun run scripts/compute-rankings.ts
